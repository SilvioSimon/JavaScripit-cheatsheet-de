<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>JS-Event</title>
    <link rel="stylesheet" href="JS-Event.css" />

  <body>
    <button onclick="window.location.href = '../index.html'">Main Page</button>

    <br /><br />
<!--

    <div id="buttons">
    <!--Version 1: veraltet und schwieriger zu verwalten, wenn es um größere Codeabschnitte geht-->
    <div id="buttons">
      <div class="row">
        <button onclick="toggleBold()">Bold</button>
        <button onclick="toggleItalic()">Italic</button>
      </div>

      <div class="row">
        <button onclick="toggleUnderline()">Underline</button>
        <button onclick="toggleMonospace()">Monospace</button>
      </div>

      <br />

      <div class="row">
        <button onclick="removeFormat()">Remove Format</button>
      </div>
    </div>
    <!--Warum sind Ereignisattribute nicht ideal zu verwenden?-->
    <!--Sie sind veraltet und machen den Code schwerer lesbar!!!-->
    <br />

    <p>
      It was a bright cold day in April, and the clocks were striking thirteen.
    </p>

    <script src="JS-Event_veraltet.js"></script>
