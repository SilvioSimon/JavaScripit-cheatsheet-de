<!--
onclick vs. addEventListener()

1. onclick:
   - Wird direkt im HTML-Element definiert.
   - Einfach für kleine Übungen.
   - HTML und JavaScript werden vermischt.

   Beispiel:
   <button onclick="logger()">Klick mich</button>

2. addEventListener():
   - Wird im JavaScript definiert.
   - Trennt HTML (Struktur) und JavaScript (Verhalten).
   - Mehrere Event-Listener können auf dasselbe Element registriert werden.
   - Wird in modernen Projekten bevorzugt.

   Beispiel:
   document.getElementById("our_p_tag")
           .addEventListener("click", logger);

Ablauf:
- document.getElementById("our_p_tag")
  sucht das Element mit der ID "our_p_tag".

- addEventListener("click", ...)
  wartet auf einen Klick des Benutzers.

- logger
  ist die Funktion, die beim Klick ausgeführt wird.

Ergebnis:
Klickt der Benutzer auf das Element, wird logger() aufgerufen.
-->
